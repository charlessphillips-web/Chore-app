<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no, viewport-fit=cover" />
    <title>Choreboard</title>
    <!-- "Add to Home Screen" on iPhone: own icon, opens full screen like an app -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Choreboard" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <link rel="manifest" href="/manifest.json" />
    <style id="expo-reset">
      html, body { height: 100%; background-color: #000000; }
      body { overflow: hidden; }
      /* Feel like an app, not a web page: pressing and holding mustn't select
         text or pop up "Copy" (it would cancel "Hold to get started"). Text
         boxes and anything marked selectable (e.g. Account ID) still work. */
      body {
        -webkit-user-select: none; user-select: none;
        -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
      }
      input, textarea, [contenteditable] { -webkit-user-select: text; user-select: text; }
      #root { display: flex; height: 100%; flex: 1; }
    </style>
  </head>
  <body oncontextmenu="return false;">
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
